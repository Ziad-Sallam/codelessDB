spring.application.name=backend
spring.profiles.active=local

spring.main.banner-mode=off
spring.main.log-startup-info=false

# Logging config
logging.file.name=./backend/logs/codelessdb.log
logging.level.root=info
logging.pattern.file=%d{hh:mm:ss} %-5level %msg%n
logging.pattern.console=%d{hh:mm:ss} %-5level %msg%n

spring.datasource.url=jdbc:mysql://localhost:3306/codelessdb?createDatabaseIfNotExist=true
# spring.datasource.username=root
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# Values
db.name=codelessdb