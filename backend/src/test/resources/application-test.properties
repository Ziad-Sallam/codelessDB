# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

frontend.url=http://localhost:5173

# Hibernate settings for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

logging.file.name=./backend/logs/codelessdb.log
logging.level.root=info
logging.pattern.file=%d{hh:mm:ss} %-5level %msg%n
logging.pattern.console=%d{hh:mm:ss} %-5level %msg%n

# Use Lucene locally
spring.jpa.properties.hibernate.search.backend.type=lucene

# Where indexes are stored
spring.jpa.properties.hibernate.search.backend.directory.root=./indexes

# Automatic indexing on entity changes
spring.jpa.properties.hibernate.search.automatic_indexing.enabled=true
