# .github/workflows/maven-ci.yml
name: Java CI with Maven

on:
  push:
    branches: [ main, milestone1, milestone3, SCRUM-202-Enhance-Github-Actions ]
  pull_request:
    branches: [ main, milestone1, milestone3, SCRUM-202-Enhance-Github-Actions ]

permissions:
  contents: write
  checks: write
  pull-requests: write
  security-events: write

concurrency:
  group: java-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify Maven
        run: mvn -v

      - name: Build and run tests with coverage
        id: maven-build
        run: mvn -B clean verify --fail-at-end -Dstyle.color=always
        continue-on-error: true

      # Extract test results
      - name: Extract Test Results
        if: always()
        id: test-results
        run: |
          if [ -d "target/surefire-reports" ]; then
            TOTAL=$(grep -h "tests=" target/surefire-reports/TEST-*.xml | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
            FAILURES=$(grep -h "failures=" target/surefire-reports/TEST-*.xml | sed 's/.*failures="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
            ERRORS=$(grep -h "errors=" target/surefire-reports/TEST-*.xml | sed 's/.*errors="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
            SKIPPED=$(grep -h "skipped=" target/surefire-reports/TEST-*.xml | sed 's/.*skipped="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
          else
            TOTAL=0; FAILURES=0; ERRORS=0; SKIPPED=0
          fi

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "failures=$FAILURES" >> $GITHUB_OUTPUT
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

      # Extract coverage
      - name: Extract Coverage
        if: always()
        id: coverage
        run: |
          if [ -f "target/site/jacoco/index.html" ]; then
            COVERAGE=$(grep -oP 'Total.*?(\d+)%' target/site/jacoco/index.html | grep -oP '\d+%' | head -1)
            COVERAGE_NUM=$(echo "$COVERAGE" | grep -oP '\d+')
          else
            COVERAGE="N/A"
            COVERAGE_NUM=0
          fi

          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "coverage_num=$COVERAGE_NUM" >> "$GITHUB_OUTPUT"


      # Show GitHub Actions summary
      - name: Show Test & Coverage Summary
        if: always()
        run: |
          TOTAL=${{ steps.test-results.outputs.total }}
          FAILURES=${{ steps.test-results.outputs.failures }}
          ERRORS=${{ steps.test-results.outputs.errors }}
          SKIPPED=${{ steps.test-results.outputs.skipped }}
          COVERAGE=${{ steps.coverage.outputs.coverage }}
          COVERAGE_NUM=${{ steps.coverage.outputs.coverage_num }}

          PASSED=$((TOTAL - FAILURES - ERRORS - SKIPPED))
          STATUS="✅"
          if [ "$FAILURES" -gt 0 ] || [ "$ERRORS" -gt 0 ] || [ "$COVERAGE_NUM" -lt 60 ]; then
            STATUS="❌"
          fi

          # Coverage status
          if [ "$COVERAGE_NUM" -ge 90 ]; then
            COVERAGE_STATUS="$COVERAGE ✅ Excellent"
          elif [ "$COVERAGE_NUM" -ge 80 ]; then
            COVERAGE_STATUS="$COVERAGE ✅ Good"
          elif [ "$COVERAGE_NUM" -ge 70 ]; then
            COVERAGE_STATUS="$COVERAGE ⚠️ Acceptable"
          elif [ "$COVERAGE_NUM" -ge 60 ]; then
            COVERAGE_STATUS="$COVERAGE ⚠️ Below Recommended"
          else
            COVERAGE_STATUS="$COVERAGE ❌ Below Minimum Threshold"
          fi

          echo "## $STATUS CI Build Report" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Tests | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $FAILURES |" >> $GITHUB_STEP_SUMMARY
          echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
          echo "| Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | $COVERAGE_STATUS |" >> $GITHUB_STEP_SUMMARY
      # Publish test report
      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Testss
          path: backend/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # Upload XML coverage to Codecov for inline PR reporting
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      # Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: steps.maven-build.outcome == 'success'
        with:
          name: package
          path: backend/target/*.jar

      # Fail workflow if build/tests fail or coverage < 60%
      - name: Fail if Build or Coverage Failed
        if: always()
        shell: bash
        run: |
          set -e

          FAILURES="${{ steps.test-results.outputs.failures }}"
          ERRORS="${{ steps.test-results.outputs.errors }}"
          COVERAGE_NUM="${{ steps.coverage.outputs.coverage_num }}"

          echo "Failures: $FAILURES"
          echo "Errors: $ERRORS"
          echo "Coverage: $COVERAGE_NUM%"

          if [[ "$FAILURES" -gt 0 || "$ERRORS" -gt 0 || "$COVERAGE_NUM" -lt 60 ]]; then
            echo "::error::Build failed due to test failures or insufficient coverage (<60%)"
            exit 1
          fi
