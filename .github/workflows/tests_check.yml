name: Java CI with Maven

on:
  push:
    branches: [ main, milestone1, milestone3, SCRUM-202-Enhance-Github-Actions ]
  pull_request:
    branches: [ main, milestone1, milestone3, SCRUM-202-Enhance-Github-Actions ]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: java-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Run Tests & Generate JaCoCo Reports
      - name: Build and Test
        id: maven-build
        run: mvn -B clean verify --fail-at-end -Dstyle.color=always
        continue-on-error: true

      # ------------------------------------------------------------------------
      # CONSOLIDATED REPORTING SCRIPT
      # Parses both Surefire (Tests) and JaCoCo (Coverage) to post ONE comment
      # ------------------------------------------------------------------------
      - name: Post Test & Coverage Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // 1. EXTRACT TEST RESULTS (Total, Pass, Fail)
            // Note: We use simple regex here for speed. For complex cases, use an XML parser.
            let total = 0, failures = 0, errors = 0, skipped = 0;
            const surefireDir = 'backend/target/surefire-reports';
            
            if (fs.existsSync(surefireDir)) {
              const files = fs.readdirSync(surefireDir).filter(f => f.endsWith('.xml'));
              for (const file of files) {
                const content = fs.readFileSync(path.join(surefireDir, file), 'utf8');
                const t = (content.match(/tests="(\d+)"/) || [0,0])[1];
                const f = (content.match(/failures="(\d+)"/) || [0,0])[1];
                const e = (content.match(/errors="(\d+)"/) || [0,0])[1];
                const s = (content.match(/skipped="(\d+)"/) || [0,0])[1];
                total += parseInt(t);
                failures += parseInt(f);
                errors += parseInt(e);
                skipped += parseInt(s);
              }
            }
            const passed = total - failures - errors - skipped;
            const statusIcon = (failures + errors) > 0 ? '🔴' : '🟢';

            // 2. EXTRACT FOLDER COVERAGE FROM CSV
            // JaCoCo generates a CSV at target/site/jacoco/jacoco.csv by default
            const csvPath = 'backend/target/site/jacoco/jacoco.csv';
            let coverageTable = '| Package | Coverage | Missed | Covered |\n| :--- | :--- | :--- | :--- |\n';
            let overallCovered = 0, overallMissed = 0;

            if (fs.existsSync(csvPath)) {
              const csvContent = fs.readFileSync(csvPath, 'utf8');
              const lines = csvContent.split('\n');
              const packageStats = {};

              // Skip header (index 0) and parse lines
              for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',');
                if (cols.length < 5) continue;
                
                const pkgName = cols[1]; // PACKAGE column
                const missed = parseInt(cols[3]); // INSTRUCTION_MISSED
                const covered = parseInt(cols[4]); // INSTRUCTION_COVERED

                if (!packageStats[pkgName]) packageStats[pkgName] = { m: 0, c: 0 };
                packageStats[pkgName].m += missed;
                packageStats[pkgName].c += covered;
                
                overallCovered += covered;
                overallMissed += missed;
              }

              // Build rows sorted by coverage (ascending)
              Object.entries(packageStats)
                .map(([pkg, stats]) => {
                   const totalInstr = stats.m + stats.c;
                   const pct = totalInstr === 0 ? 0 : (stats.c / totalInstr) * 100;
                   return { pkg, pct, ...stats };
                })
                .sort((a, b) => a.pct - b.pct) // Sort lowest coverage first
                .forEach(item => {
                   const bar = item.pct < 50 ? '🔴' : (item.pct < 80 ? '🟡' : '🟢');
                   coverageTable += `| **${item.pkg}** | ${bar} ${item.pct.toFixed(1)}% | ${item.m} | ${item.c} |\n`;
                });
            } else {
              coverageTable += '| N/A | No Report Found | - | - |\n';
            }

            const totalInstr = overallCovered + overallMissed;
            const totalPct = totalInstr === 0 ? 0 : (overallCovered / totalInstr) * 100;

            // 3. CONSTRUCT COMMENT BODY
            const body = `
            ### ${statusIcon} Test & Coverage Report
            
            **Summary**
            | Metric | Count |
            | :--- | :--- |
            | Total Tests | ${total} |
            | Passed | ${passed} |
            | Failed | ${failures} |
            | Overall Coverage | **${totalPct.toFixed(1)}%** |

            <details>
            <summary>📂 <b>Click to view Package-Level Coverage</b></summary>
            
            ${coverageTable}
            
            </details>
            `;

            // 4. POST OR UPDATE COMMENT
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existingComment = comments.find(c => c.body.includes('### 🔴 Test & Coverage Report') || c.body.includes('### 🟢 Test & Coverage Report'));

            if (existingComment) {
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      # Standard Test Reporting in "Checks" tab
      - name: Publish Test Report (Checks)
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: backend/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # Upload Artifacts
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        if: steps.maven-build.outcome == 'success'
        with:
          name: spring-boot-app
          path: backend/target/*.jar

      # Fail logic
      - name: Verify Thresholds
        if: always()
        run: |
          # Use grep to find if the maven build failed earlier
          if [ "${{ steps.maven-build.outcome }}" != "success" ]; then
             echo "::error::Build Failed"
             exit 1
          fi