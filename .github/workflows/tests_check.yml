name: Java CI with Maven

on:
  push:
    branches: [ main, milestone1, milestone3, SCRUM-202-Enhance-Github-Actions ]
  pull_request:
    branches: [ main, milestone1, milestone3, SCRUM-202-Enhance-Github-Actions ]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: java-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Run Tests & Generate JaCoCo CSV/XML
      - name: Build and Test
        id: maven-build
        run: mvn -B clean verify --fail-at-end -Dstyle.color=always
        continue-on-error: true

      # ------------------------------------------------------------------------
      # ADVANCED REPORTING SCRIPT
      # Creates a nested Package -> File structure
      # ------------------------------------------------------------------------
      - name: Post Advanced Test & Coverage Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // --- CONFIGURATION ---
            const surefireDir = 'backend/target/surefire-reports';
            const jacocoCsvPath = 'backend/target/site/jacoco/jacoco.csv';
            
            // --- 1. PARSE TEST RESULTS (Surefire XMLs) ---
            let total = 0, failures = 0, errors = 0, skipped = 0;
            if (fs.existsSync(surefireDir)) {
              const files = fs.readdirSync(surefireDir).filter(f => f.endsWith('.xml'));
              for (const file of files) {
                const content = fs.readFileSync(path.join(surefireDir, file), 'utf8');
                const t = (content.match(/tests="(\d+)"/) || [0,0])[1];
                const f = (content.match(/failures="(\d+)"/) || [0,0])[1];
                const e = (content.match(/errors="(\d+)"/) || [0,0])[1];
                const s = (content.match(/skipped="(\d+)"/) || [0,0])[1];
                total += parseInt(t);
                failures += parseInt(f);
                errors += parseInt(e);
                skipped += parseInt(s);
              }
            }
            const passed = total - failures - errors - skipped;
            const statusIcon = (failures + errors) > 0 ? '🔴' : '🟢';

            // --- 2. PARSE COVERAGE (JaCoCo CSV) & GROUP BY PACKAGE ---
            let coverageHtml = '';
            let overallCovered = 0, overallMissed = 0;

            if (fs.existsSync(jacocoCsvPath)) {
              const csvContent = fs.readFileSync(jacocoCsvPath, 'utf8');
              const lines = csvContent.split('\n');
              const packages = {}; // Map: packageName -> { missed, covered, classes: [] }

              // CSV Header: GROUP, PACKAGE, CLASS, INSTRUCTION_MISSED, INSTRUCTION_COVERED...
              for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',');
                if (cols.length < 5) continue;
                
                const pkgName = cols[1];
                const className = cols[2];
                const missed = parseInt(cols[3]); 
                const covered = parseInt(cols[4]);
                
                if (!packages[pkgName]) {
                  packages[pkgName] = { m: 0, c: 0, classes: [] };
                }
                
                // Add to package totals
                packages[pkgName].m += missed;
                packages[pkgName].c += covered;
                
                // Add class data
                const totalInst = missed + covered;
                const pct = totalInst === 0 ? 0 : (covered / totalInst) * 100;
                packages[pkgName].classes.push({ name: className, pct: pct, m: missed, c: covered });
                
                // Add to global totals
                overallCovered += covered;
                overallMissed += missed;
              }

              // Build HTML Hierarchy
              // Iterate over packages sorted by coverage (ascending)
              const sortedPackages = Object.entries(packages).sort((a, b) => {
                 const pctA = (a[1].c / (a[1].c + a[1].m));
                 const pctB = (b[1].c / (b[1].c + b[1].m));
                 return pctA - pctB; 
              });

              for (const [pkgName, data] of sortedPackages) {
                 const pkgTotal = data.m + data.c;
                 const pkgPct = pkgTotal === 0 ? 0 : (data.c / pkgTotal) * 100;
                 const pkgIcon = pkgPct < 50 ? '🔴' : (pkgPct < 80 ? '🟡' : '🟢');
                 
                 // Start Package Details
                 coverageHtml += `<details><summary><b>${pkgIcon} ${pkgName}</b> (${pkgPct.toFixed(1)}%)</summary>\n`;
                 coverageHtml += `<blockquote>\n<table>\n`;
                 coverageHtml += `<thead><tr><th>Class</th><th>Coverage</th><th>Missed</th><th>Covered</th></tr></thead>\n<tbody>\n`;
                 
                 // List Files inside Package
                 data.classes.sort((a,b) => a.pct - b.pct).forEach(cls => {
                    const fileIcon = cls.pct < 50 ? '🔴' : (cls.pct < 80 ? '🟡' : '🟢');
                    coverageHtml += `<tr><td>${fileIcon} ${cls.name}</td><td>${cls.pct.toFixed(1)}%</td><td>${cls.m}</td><td>${cls.c}</td></tr>\n`;
                 });

                 coverageHtml += `</tbody>\n</table>\n</blockquote>\n</details>\n`;
              }
            } else {
              coverageHtml = '<p>No coverage report found.</p>';
            }

            const grandTotal = overallCovered + overallMissed;
            const grandPct = grandTotal === 0 ? 0 : (overallCovered / grandTotal) * 100;

            // --- 3. BUILD FINAL COMMENT ---
            const body = `
            ### ${statusIcon} Test & Coverage Report
            
            | Metric | Count |
            | :--- | :--- |
            | **Total Tests** | ${total} |
            | **Passed** | 🟢 ${passed} |
            | **Failed** | 🔴 ${failures} |
            | **Overall Coverage** | **${grandPct.toFixed(1)}%** |

            ---
            ### 📂 Package Breakdown
            _Click on a package to view class-level coverage._
            
            ${coverageHtml}
            `;

            // --- 4. POST COMMENT ---
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // Find existing bot comment to update instead of spamming
            const botComment = comments.find(c => c.body.includes('Test & Coverage Report'));

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      # Standard Checks
      - name: Publish Test Report (Checks)
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: backend/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # Upload Artifacts
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        if: steps.maven-build.outcome == 'success'
        with:
          name: spring-boot-app
          path: backend/target/*.jar

      # Fail Build if necessary
      - name: Verify Quality Gate
        if: always()
        run: |
          if [ "${{ steps.maven-build.outcome }}" != "success" ]; then
             echo "::error::Maven Build Failed"
             exit 1
          fi