name: Java CI with Maven

on:
  push:
    branches: [ main, milestone1, milestone3, SCRUM-202-Enhance-Github-Actions ]
  pull_request:
    branches: [ main, milestone1, milestone3, SCRUM-202-Enhance-Github-Actions ]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: java-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Run Tests & Generate Jacoco XML
      # -Dstyle.color=always ensures logs are readable
      # --fail-at-end allows all tests to run before failing
      - name: Build and Test
        id: maven-build
        run: mvn -B clean verify --fail-at-end -Dstyle.color=always
        continue-on-error: true

      # ------------------------------------------------------------------------
      # 1. PARSE METRICS (Bash)
      # ------------------------------------------------------------------------
      - name: Extract Metrics
        if: always()
        id: metrics
        run: |
          # Default values
          TOTAL=0; FAILURES=0; ERRORS=0; SKIPPED=0; PASSED=0; COVERAGE_NUM=0

          # Extract Test Counts from Surefire XMLs
          if [ -d "target/surefire-reports" ]; then
            TOTAL=$(grep -h "tests=" target/surefire-reports/TEST-*.xml | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
            FAILURES=$(grep -h "failures=" target/surefire-reports/TEST-*.xml | sed 's/.*failures="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
            ERRORS=$(grep -h "errors=" target/surefire-reports/TEST-*.xml | sed 's/.*errors="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
            SKIPPED=$(grep -h "skipped=" target/surefire-reports/TEST-*.xml | sed 's/.*skipped="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
            
            # Math for Passed tests
            PASSED=$((TOTAL - FAILURES - ERRORS - SKIPPED))
          fi

          # Extract Coverage % from JaCoCo HTML (for the summary line)
          if [ -f "target/site/jacoco/index.html" ]; then
             COVERAGE_Line=$(grep -oP 'Total.*?(\d+)%' target/site/jacoco/index.html | grep -oP '\d+%' | head -1)
             COVERAGE_NUM=$(echo "$COVERAGE_Line" | grep -oP '\d+')
          fi

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failures=$FAILURES" >> $GITHUB_OUTPUT
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "coverage_num=$COVERAGE_NUM" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------------
      # 2. REPORTING (Comments & Checks)
      # ------------------------------------------------------------------------
      
      # A. Detailed Package-Level Coverage Table
      - name: PR Comment - Package Coverage
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 60
          min-coverage-changed-files: 60
          title: "📂 Coverage Breakdown"
          update-comment: true

      # B. High-Level Test Summary Table
      - name: PR Comment - Test Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const summary = `
            ### ✅ Test Execution Summary
            | Metric | Count |
            | :--- | :--- |
            | **Total Tests** | ${{ steps.metrics.outputs.total }} |
            | **Passed** | 🟢 ${{ steps.metrics.outputs.passed }} |
            | **Failed** | 🔴 ${{ steps.metrics.outputs.failures }} |
            | **Errors** | ⚠️ ${{ steps.metrics.outputs.errors }} |
            | **Skipped** | ⚪ ${{ steps.metrics.outputs.skipped }} |
            | **Overall Coverage** | **${{ steps.metrics.outputs.coverage_num }}%** |
            
            _See the "Coverage Breakdown" comment for folder-level details._
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      # C. Populate GitHub "Checks" Tab
      - name: Publish Test Report to Checks
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: backend/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # 3. ARTIFACTS & FAILURE GATES
      # ------------------------------------------------------------------------
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        if: steps.maven-build.outcome == 'success'
        with:
          name: spring-boot-app
          path: backend/target/*.jar

      - name: Verify Quality Gate
        if: always()
        shell: bash
        run: |
          FAILURES=${{ steps.metrics.outputs.failures }}
          ERRORS=${{ steps.metrics.outputs.errors }}
          COVERAGE=${{ steps.metrics.outputs.coverage_num }}

          # Check 1: Did the Maven build actually succeed?
          if [ "${{ steps.maven-build.outcome }}" != "success" ]; then
             echo "::error::Maven Build Failed"
             exit 1
          fi

          # Check 2: Are there test failures?
          if [[ "$FAILURES" -gt 0 || "$ERRORS" -gt 0 ]]; then
             echo "::error::Tests failed: $FAILURES failures, $ERRORS errors."
             exit 1
          fi

          # Check 3: Is coverage acceptable?
          if [[ "$COVERAGE" -lt 60 ]]; then
             echo "::error::Code Coverage ($COVERAGE%) is below the 60% threshold."
             exit 1
          fi
          
          echo "✅ Build, Tests, and Quality Gate Passed!"