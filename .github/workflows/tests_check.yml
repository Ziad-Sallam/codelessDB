name: Check Java Tests

on:
  push:
    branches:
      - main
      - milestone1
      - milestone3

  pull_request:
    branches:
      - main
      - milestone1
      - milestone3

concurrency:
  group: java-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify Maven
        run: mvn -v

      - name: Run tests
        run: mvn -B clean test --fail-at-end -Dstyle.color=always

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports


