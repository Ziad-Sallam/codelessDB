# .github/workflows/maven.yml
name: Java CI with Maven

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: write
  checks: write
  pull-requests: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    # Run build and capture the outcome
    - name: Build and run tests with coverage
      id: maven-build
      run: mvn -B verify --file ./backend/pom.xml
      continue-on-error: true  # Continue to show details, but track failure
    
    # Extract test results
    - name: Extract Test Results
      if: always()
      id: test-results
      run: |
        if [ -d "backend/target/surefire-reports" ]; then
          TOTAL=$(find backend/target/surefire-reports -name "TEST-*.xml" -exec grep -h "tests=" {} \; | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
          FAILURES=$(find backend/target/surefire-reports -name "TEST-*.xml" -exec grep -h "failures=" {} \; | sed 's/.*failures="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
          ERRORS=$(find backend/target/surefire-reports -name "TEST-*.xml" -exec grep -h "errors=" {} \; | sed 's/.*errors="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
          SKIPPED=$(find backend/target/surefire-reports -name "TEST-*.xml" -exec grep -h "skipped=" {} \; | sed 's/.*skipped="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
          
          echo "total=${TOTAL:-0}" >> $GITHUB_OUTPUT
          echo "failures=${FAILURES:-0}" >> $GITHUB_OUTPUT
          echo "errors=${ERRORS:-0}" >> $GITHUB_OUTPUT
          echo "skipped=${SKIPPED:-0}" >> $GITHUB_OUTPUT
        fi
    
    # Extract coverage percentage
    - name: Extract Coverage
      if: always()
      id: coverage
      run: |
        if [ -f "backend/target/site/jacoco/index.html" ]; then
          COVERAGE=$(grep -oP 'Total.*?(\d+)%' backend/target/site/jacoco/index.html | grep -oP '\d+%' | head -1 || echo "N/A")
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          
          # Extract numeric value for comparison
          COVERAGE_NUM=$(echo $COVERAGE | grep -oP '\d+' || echo "0")
          echo "coverage_num=$COVERAGE_NUM" >> $GITHUB_OUTPUT
        else
          echo "coverage=N/A" >> $GITHUB_OUTPUT
          echo "coverage_num=0" >> $GITHUB_OUTPUT
        fi
    
    # Determine why build failed (if it did)
    - name: Analyze Build Failure
      if: always()
      id: failure-reason
      run: |
        BUILD_OUTCOME="${{ steps.maven-build.outcome }}"
        FAILURES="${{ steps.test-results.outputs.failures }}"
        ERRORS="${{ steps.test-results.outputs.errors }}"
        COVERAGE_NUM="${{ steps.coverage.outputs.coverage_num }}"
        
        if [ "$BUILD_OUTCOME" = "success" ]; then
          echo "reason=none" >> $GITHUB_OUTPUT
          echo "failed=false" >> $GITHUB_OUTPUT
        elif [ "$FAILURES" != "0" ] || [ "$ERRORS" != "0" ]; then
          echo "reason=tests_failed" >> $GITHUB_OUTPUT
          echo "failed=true" >> $GITHUB_OUTPUT
        elif [ "$COVERAGE_NUM" -lt 60 ] && [ "$COVERAGE_NUM" != "0" ]; then
          echo "reason=coverage_too_low" >> $GITHUB_OUTPUT
          echo "failed=true" >> $GITHUB_OUTPUT
        else
          echo "reason=build_error" >> $GITHUB_OUTPUT
          echo "failed=true" >> $GITHUB_OUTPUT
        fi
    
    # Post detailed comment to PR
    - name: Comment Test Results on PR
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const total = '${{ steps.test-results.outputs.total }}';
          const failures = '${{ steps.test-results.outputs.failures }}';
          const errors = '${{ steps.test-results.outputs.errors }}';
          const skipped = '${{ steps.test-results.outputs.skipped }}';
          const coverage = '${{ steps.coverage.outputs.coverage }}';
          const coverageNum = parseInt('${{ steps.coverage.outputs.coverage_num }}');
          const failureReason = '${{ steps.failure-reason.outputs.reason }}';
          const hasFailed = '${{ steps.failure-reason.outputs.failed }}' === 'true';
          const passed = total - failures - errors - skipped;
          const runId = context.runId;
          const repoUrl = context.payload.repository.html_url;
          
          // Determine overall status emoji
          const status = hasFailed ? '❌' : '✅';
          const buildStatus = hasFailed ? '**Failed**' : '**Passed**';
          
          // Build coverage status message
          let coverageStatus = '';
          let coverageEmoji = '';
          
          if (failureReason === 'coverage_too_low') {
            coverageEmoji = '❌';
            coverageStatus = `${coverage} ${coverageEmoji} **Below Minimum Threshold**`;
          } else if (coverageNum >= 80) {
            coverageEmoji = '✅';
            coverageStatus = `${coverage} ${coverageEmoji} **Excellent**`;
          } else if (coverageNum >= 70) {
            coverageEmoji = '✅';
            coverageStatus = `${coverage} ${coverageEmoji} **Good**`;
          } else if (coverageNum >= 60) {
            coverageEmoji = '⚠️';
            coverageStatus = `${coverage} ${coverageEmoji} **Acceptable**`;
          } else if (coverage !== 'N/A') {
            coverageEmoji = '⚠️';
            coverageStatus = `${coverage} ${coverageEmoji} **Below Recommended**`;
          } else {
            coverageStatus = 'N/A';
          }
          
          // Build failure details section
          let failureDetails = '';
          if (failureReason === 'tests_failed') {
            failureDetails = `\n### ⚠️ Build Failure Analysis\n\n**Failure Type:** Test Failures\n\n**Details:** ${failures} test(s) failed during execution. All tests must pass before this pull request can be merged.\n\n**Required Action:** Please review and fix the failing tests, then push your changes to re-trigger the build.\n`;
          } else if (failureReason === 'coverage_too_low') {
            failureDetails = `\n### ⚠️ Build Failure Analysis\n\n**Failure Type:** Insufficient Code Coverage\n\n**Details:** The current code coverage of **${coverage}** does not meet the minimum required threshold of **60%** as specified in the project's quality standards (pom.xml configuration).\n\n**Required Actions:**\n1. Review uncovered code sections in the coverage report\n2. Add comprehensive unit tests for untested code paths\n3. Execute \`mvn clean verify\` locally to validate coverage improvements\n4. Ensure coverage meets or exceeds the 60% threshold before requesting review\n`;
          } else if (failureReason === 'build_error') {
            failureDetails = `\n### ⚠️ Build Failure Analysis\n\n**Failure Type:** Build Compilation Error\n\n**Details:** The build process encountered compilation or configuration errors.\n\n**Required Action:** Please review the build logs for specific error details and resolve all compilation issues.\n`;
          }
          
          // Build resources section
          const resourcesSection = `\n### 📋 Available Resources\n\n| Resource | Description | Link |\n|----------|-------------|------|\n| 📊 Coverage Report (HTML) | Detailed line-by-line coverage analysis | [View Report](${repoUrl}/actions/runs/${runId}#artifacts) → Download \`coverage-report\` |\n| 📦 Build Artifact (JAR) | Compiled application package | ${hasFailed ? '*Not available (build failed)*' : `[Download JAR](${repoUrl}/actions/runs/${runId}#artifacts) → Download \`package\``} |\n| 📝 Test Report | Detailed test execution results | [View Tests](${repoUrl}/actions/runs/${runId}) → Check "Maven Tests" |\n| 🔍 Full Build Logs | Complete build execution logs | [View Logs](${repoUrl}/actions/runs/${runId}) |\n`;
          
          // Build the formal comment body
          const body = `## ${status} Continuous Integration Build Report
          
          ### Build Summary
          
          | Metric | Status |
          |--------|--------|
          | **Build Status** | ${buildStatus} |
          | **Total Tests** | ${total} |
          | **Tests Passed** | ✅ ${passed} |
          | **Tests Failed** | ❌ ${failures} |
          | **Tests Errors** | ⚠️ ${errors} |
          | **Tests Skipped** | ⏭️ ${skipped} |
          | **Code Coverage** | ${coverageStatus} |
          ${failureDetails}${resourcesSection}
          ---
          
          <details>
          <summary>ℹ️ Additional Information</summary>
          
          **Workflow:** ${context.workflow}  
          **Run ID:** ${runId}  
          **Triggered by:** ${context.actor}  
          **Event:** ${context.eventName}  
          **Commit:** ${context.sha.substring(0, 7)}
          
          </details>
          
          ---
          
          *This comment was automatically generated by the CI/CD pipeline. For questions or issues, please contact the development team.*
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
    
    - name: Publish Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Maven Tests
        path: '**/target/surefire-reports/TEST-*.xml'
        reporter: java-junit
        fail-on-error: true  # This will mark the check as failed if tests fail
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: ./backend/target/site/jacoco/jacoco.xml
        fail_ci_if_error: false
        verbose: true
    
    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: backend/target/site/jacoco/
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: steps.maven-build.outcome == 'success'
      with:
        name: package
        path: backend/target/*.jar
    
    - name: Submit Dependency Graph
      uses: advanced-security/maven-dependency-submission-action@v4
      if: steps.maven-build.outcome == 'success'
      with:
        directory: backend
        token: ${{ secrets.GITHUB_TOKEN }}
        ignore-maven-wrapper: true
        maven-args: -DskipTests
      continue-on-error: true
    
    # FINAL STEP: Fail the workflow if build failed
    - name: Final Build Status Check
      if: steps.maven-build.outcome != 'success'
      run: |
        echo "::error::Build failed - see details in the PR comment and logs above"
        echo "Failure reason: ${{ steps.failure-reason.outputs.reason }}"
        exit 1
  dependabot:
    runs-on: ubuntu-latest
    needs: build
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - name: Dependabot metadata
      id: metadata
      uses: dependabot/fetch-metadata@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Auto-approve Dependabot PR
      if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
      run: gh pr review --approve "$PR_URL"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Auto-merge Dependabot PR
      if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
      run: gh pr merge --auto --squash "$PR_URL"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}