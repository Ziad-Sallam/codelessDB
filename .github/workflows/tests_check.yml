name: Java CI with Maven

on:
  push:
    branches: [ main, milestone1, milestone3, SCRUM-202-Enhance-Github-Actions ]
  pull_request:
    branches: [ main, milestone1, milestone3, SCRUM-202-Enhance-Github-Actions ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

concurrency:
  group: java-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify Maven
        run: mvn -v

      - name: Build and run tests with coverage
        id: maven-build
        run: mvn -B clean verify --fail-at-end -Dstyle.color=always
        continue-on-error: true

      - name: Extract Test Results
        if: always()
        id: test-results
        run: |
          if [ -d "target/surefire-reports" ]; then
            TOTAL=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "tests=" {} \; | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
            FAILURES=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "failures=" {} \; | sed 's/.*failures="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
            ERRORS=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "errors=" {} \; | sed 's/.*errors="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
            SKIPPED=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "skipped=" {} \; | sed 's/.*skipped="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')

            echo "total=${TOTAL:-0}" >> $GITHUB_OUTPUT
            echo "failures=${FAILURES:-0}" >> $GITHUB_OUTPUT
            echo "errors=${ERRORS:-0}" >> $GITHUB_OUTPUT
            echo "skipped=${SKIPPED:-0}" >> $GITHUB_OUTPUT
          fi

      - name: Extract Coverage
        if: always()
        id: coverage
        run: |
          if [ -f "target/site/jacoco/index.html" ]; then
            COVERAGE=$(grep -oP 'Total.*?(\d+)%' target/site/jacoco/index.html | grep -oP '\d+%' | head -1 || echo "N/A")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            COVERAGE_NUM=$(echo $COVERAGE | grep -oP '\d+' || echo "0")
            echo "coverage_num=$COVERAGE_NUM" >> $GITHUB_OUTPUT
          else
            echo "coverage=N/A" >> $GITHUB_OUTPUT
            echo "coverage_num=0" >> $GITHUB_OUTPUT
          fi

      - name: Determine Failure Reason
        if: always()
        id: failure-reason
        run: |
          BUILD_OUTCOME="${{ steps.maven-build.outcome }}"
          FAILURES="${{ steps.test-results.outputs.failures }}"
          ERRORS="${{ steps.test-results.outputs.errors }}"
          COVERAGE_NUM="${{ steps.coverage.outputs.coverage_num }}"
          
          if [ "$BUILD_OUTCOME" = "success" ]; then
            echo "reason=none" >> $GITHUB_OUTPUT
            echo "failed=false" >> $GITHUB_OUTPUT
          elif [ "$FAILURES" != "0" ] || [ "$ERRORS" != "0" ]; then
            echo "reason=tests_failed" >> $GITHUB_OUTPUT
            echo "failed=true" >> $GITHUB_OUTPUT
          elif [ "$COVERAGE_NUM" -lt 60 ] && [ "$COVERAGE_NUM" != "0" ]; then
            echo "reason=coverage_too_low" >> $GITHUB_OUTPUT
            echo "failed=true" >> $GITHUB_OUTPUT
          else
            echo "reason=build_error" >> $GITHUB_OUTPUT
            echo "failed=true" >> $GITHUB_OUTPUT
          fi

      - name: Comment Test Summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const total = '${{ steps.test-results.outputs.total }}';
            const failures = '${{ steps.test-results.outputs.failures }}';
            const errors = '${{ steps.test-results.outputs.errors }}';
            const skipped = '${{ steps.test-results.outputs.skipped }}';
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const coverageNum = parseInt('${{ steps.coverage.outputs.coverage_num }}');
            const failureReason = '${{ steps.failure-reason.outputs.reason }}';
            const hasFailed = '${{ steps.failure-reason.outputs.failed }}' === 'true';
            const passed = total - failures - errors - skipped;
            const runId = context.runId;
            const repoUrl = context.payload.repository.html_url;

            const status = hasFailed ? '❌' : '✅';
            const buildStatus = hasFailed ? '**Failed**' : '**Passed**';

            let coverageStatus = '';
            if (failureReason === 'coverage_too_low') {
              coverageStatus = `${coverage} ❌ **Below Minimum Threshold**`;
            } else if (coverageNum >= 98 {
              coverageStatus = `${coverage} ✅ **Excellent**`;
            } else if (coverageNum >= 95) {
              coverageStatus = `${coverage} ✅ **Good**`;
            } else if (coverageNum >= 90) {
              coverageStatus = `${coverage} ⚠️ **Acceptable**`;
            } else if (coverage !== 'N/A') {
              coverageStatus = `${coverage} ⚠️ **Below Recommended**`;
            } else {
              coverageStatus = 'N/A';
            }

            let failureDetails = '';
            if (failureReason === 'tests_failed') {
              failureDetails = `\n### ⚠️ Build Failure Analysis\n**Failure Type:** Test Failures\n**Details:** ${failures} test(s) failed. Fix before merge.\n`;
            } else if (failureReason === 'coverage_too_low') {
              failureDetails = `\n### ⚠️ Build Failure Analysis\n**Failure Type:** Insufficient Coverage\n**Details:** Coverage is ${coverage}, below required 60%.\n`;
            } else if (failureReason === 'build_error') {
              failureDetails = `\n### ⚠️ Build Failure Analysis\n**Failure Type:** Build Error\n**Details:** Check build logs for errors.\n`;
            }

            const resourcesSection = `\n### 📋 Resources\n| Resource | Link |\n|----------|------|\n| 📊 Coverage Report | [Download](${repoUrl}/actions/runs/${runId}#artifacts) |\n| 📝 Test Report | [View Tests](${repoUrl}/actions/runs/${runId}) |\n| 🔍 Full Logs | [View Logs](${repoUrl}/actions/runs/${runId}) |\n`;

            const body = `## ${status} CI Build Report      ### Build Summary


      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: 'backend/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: backend/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/target/site/jacoco/

      - name: Upload build artifacts
        if: steps.maven-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: backend/target/*.jar

      - name: Final Build Status Check
        if: steps.maven-build.outcome != 'success'
        run: |
          echo "::error::Build failed - see details in PR comment and logs"
          exit 1
