name: Java CI with Maven

on:
  push:
    branches: [ main, milestone1, milestone3, SCRUM-202-Enhance-Github-Actions ]
  pull_request:
    branches: [ main, milestone1, milestone3, SCRUM-202-Enhance-Github-Actions ]

permissions:
  contents: read
  checks: write  # Required by dorny/test-reporter
  pull-requests: write

concurrency:
  group: java-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify Maven
        run: mvn -v

      - name: Build and run tests with coverage
        id: maven-build
        run: mvn -B clean verify --fail-at-end -Dstyle.color=always
        continue-on-error: true

      - name: Extract Test Results
        if: always()
        id: test-results
        run: |
          if [ -d "target/surefire-reports" ]; then
            TOTAL=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "tests=" {} \; | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
            FAILURES=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "failures=" {} \; | sed 's/.*failures="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
            ERRORS=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "errors=" {} \; | sed 's/.*errors="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
            SKIPPED=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "skipped=" {} \; | sed 's/.*skipped="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s}')
            
            echo "total=${TOTAL:-0}" >> $GITHUB_OUTPUT
            echo "failures=${FAILURES:-0}" >> $GITHUB_OUTPUT
            echo "errors=${ERRORS:-0}" >> $GITHUB_OUTPUT
            echo "skipped=${SKIPPED:-0}" >> $GITHUB_OUTPUT
          fi

      - name: Extract Coverage
        if: always()
        id: coverage
        run: |
          if [ -f "target/site/jacoco/index.html" ]; then
            COVERAGE=$(grep -oP 'Total.*?(\d+)%' target/site/jacoco/index.html | grep -oP '\d+%' | head -1 || echo "N/A")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            COVERAGE_NUM=$(echo $COVERAGE | grep -oP '\d+' || echo "0")
            echo "coverage_num=$COVERAGE_NUM" >> $GITHUB_OUTPUT
          else
            echo "coverage=N/A" >> $GITHUB_OUTPUT
            echo "coverage_num=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: true
          github-token: ${{ secrets.GITHUB_TOKEN }}  # Fixes integration access error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
          verbose: true

      - name: Final Build Status Check
        if: steps.maven-build.outcome != 'success'
        run: |
          echo "::error::Build failed - see test reports and coverage above"
          exit 1

      - name: Comment Test Summary on PR
        if: github.event_name == 'pull_request' 
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: '## 🧪 Test Summary'
          message: |
            **Total Tests:** ${{ steps.test-results.outputs.total }}
            **Failures:** ${{ steps.test-results.outputs.failures }}
            **Errors:** ${{ steps.test-results.outputs.errors }}
            **Skipped:** ${{ steps.test-results.outputs.skipped }}
            **Code Coverage:** ${{ steps.coverage.outputs.coverage }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          