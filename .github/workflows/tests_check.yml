name: Java CI with Coverage and Test Results

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write # Required for test-reporter to create check runs

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Tests
        # Use continue-on-error so the report is generated even if tests fail
        run: mvn clean test
        continue-on-error: true

      # 1. Show Coverage per Package (Folder)
      - name: Add Coverage PR Comment
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: ${{ github.workspace }}/backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          title: "📊 Package Coverage Report"
          update-comment: true

      # 2. Show Number of Tests Passed/Failed
      - name: Test Report
        uses: dorny/test-reporter@v1
        with:
          name: "✅ JUnit Test Results"
          path: "backend/target/surefire-reports/*.xml"
          reporter: java-junit
          token: ${{ secrets.GITHUB_TOKEN }}